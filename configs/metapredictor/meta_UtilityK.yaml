## Utility-K aggregation over COCO CAM/VLMJudge outputs

explain:
  name: UtilityK
  kwargs:
    k: 3
    n_trials: 2
    n_query: 20
    seed: 0
    # Optional: configure a real VLM here.
    vlm:
      name: VLLMClient
      kwargs:
        model_name: Qwen/Qwen3-VL-2B-Instruct
        port: 8000

datasets:
  - name: MetaProcess
    ds_name: meta_coco_CAM_GradCAM
    path: /home/phng1216/Thesis/autoXplain/outputs/coco/coco_CAM_GradCAM
    targeted_keys:
      prediction: prediction
      original_image: original_images
      explain_image: saliency_images
    model:
      name: torchvision

  - name: MetaProcess

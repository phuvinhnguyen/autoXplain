      explain_image: saliency_images
    model:
      name: torchvision

  - name: MetaProcess
    ds_name: meta_coco_CAM_ScoreCAM
    path: /home/phng1216/Thesis/autoXplain/outputs/coco/coco_CAM_ScoreCAM

## Utility-K (VLM-simulated) on PASTA test set
#
# Minimal config:
# - Uses PASTA-trained ResNet50 per dataset (see pasta_resnet50 model source).
# - By default, omit `vlm` to run in smoke-test mode (utility will be ~0).
# - To use a real VLM, add `vlm:` block similar to pasta_VLMJudge.yaml.

explain:
  name: UtilityK
  kwargs:
    k: 3
    n_trials: 2
    n_query: 20
    seed: 0
    # Optional: provide an inner explainer signal.
    # type: "score" uses a score method output as textual signal.
    # type: "saliency" uses a saliency method (currently adds a textual hint).
    explainer:
      type: score
      method: Uncertainty
      kwargs:
        saliency_config:
          method: CAMSaliency
          cam: GradCAM
          layer: 0
          slope: 25
          position: 0.4

datasets:
  - name: ImageProcess
    ds_name: pasta_test_UtilityK
    path: /home/phng1216/Thesis/autoXplain/datasets/annotated/pasta/test_imgs
    prefix: catsdogscars_
    model:
      name: pasta_resnet50
      dataset: catsdogscars

  - name: ImageProcess
    ds_name: pasta_test_UtilityK
    path: /home/phng1216/Thesis/autoXplain/datasets/annotated/pasta/test_imgs
    prefix: coco_
    model:
      name: pasta_resnet50
      dataset: coco

  - name: ImageProcess
    ds_name: pasta_test_UtilityK
    path: /home/phng1216/Thesis/autoXplain/datasets/annotated/pasta/test_imgs
    prefix: monumai_
    model:
      name: pasta_resnet50
      dataset: monumai

  - name: ImageProcess
    ds_name: pasta_test_UtilityK
    path: /home/phng1216/Thesis/autoXplain/datasets/annotated/pasta/test_imgs
    prefix: pascalpart_
    model:
      name: pasta_resnet50
      dataset: pascalpart

output: /home/phng1216/Thesis/autoXplain/outputs


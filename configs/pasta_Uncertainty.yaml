# Uncertainty (prediction confidence) on PASTA test set
explain:
  method: Uncertainty
  saliency:
    method: CAMSaliency
    cam: GradCAM
    layer: 0
    slope: 25
    position: 0.4
  kwargs:
    labels:
      - cats
      - dogs
      - cars
      - Baroque
      - Gothic
      - Hispanic-Muslim
      - Renaissance
      - shopping_and_dining
      - workplace
      - home_or_hotel
      - transportation
      - sports_and_leisure
      - cultural
      - aeroplane
      - bicycle
      - bird
      - bottle
      - bus
      - car
      - cat
      - cow
      - dog
      - horse
      - motorbike
      - person
      - pottedplant
      - sheep
      - train
      - tvmonitor

datasets:
  - name: pasta_test_Uncertainty
    path: /home/phng1216/Thesis/PASTA/PASTA/test_imgs
    model:
      source: torchvision
      name: resnet18
      model_type: classification
      weight: DEFAULT

output: /home/phng1216/Thesis/autoXplain/outputs
